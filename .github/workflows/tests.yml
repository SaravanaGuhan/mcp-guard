name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The dynamic tests launch the Node fixtures. Without node they skip
      # rather than fail, but then they are not testing anything.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Editable install so the tests import the same package a user installs.
      # The dev extra carries pytest-xdist, which pytest.ini's addopts require.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Options live in pytest.ini; passing them again here is how they got
      # duplicated before.
      - name: Run the suite
        run: python -m pytest

      - name: Verify the console script works
        run: mcp-guard --version

      - name: Verify the module entry point works
        run: python -m mcp_guard.cli tests/fixtures/clean-server --offline --fail-on high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
