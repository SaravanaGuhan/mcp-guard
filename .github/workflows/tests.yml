name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The dynamic tests launch the Node fixtures; without node they skip.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tree-sitter tree-sitter-javascript cvss jsonschema

      - name: Run the suite
        run: python -m pytest tests

      - name: Verify the tool runs end to end
        run: python -m mcp_guard.cli tests/fixtures/clean-server --offline --fail-on high
